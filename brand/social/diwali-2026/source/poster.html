<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
html,body{margin:0;background:#1a0a04}
#p{position:relative;overflow:hidden}
#p img{position:absolute;inset:0;width:100%;height:100%}
.t{position:absolute;left:60px;right:60px;text-align:center;color:#FBF3E8}
.lab{font:500 22px/1 "IBM Plex Mono",monospace;letter-spacing:.34em;text-transform:uppercase;color:#F2C477;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.h{font:700 66px/1.16 "Libre Baskerville",Georgia,serif;letter-spacing:-0.005em;margin-top:22px;text-shadow:0 2px 22px rgba(40,8,0,.45)}
.h em{font-style:normal;color:#FFD58E}
.m{font:400 30px/1.42 "IBM Plex Sans",sans-serif;color:#F0DCC8;margin:30px auto 0;max-width:820px;text-shadow:0 1px 12px rgba(40,8,0,.4)}
#mk{position:absolute;width:74px;height:74px;filter:drop-shadow(1px 1px 0 #7a5620) drop-shadow(1px 1px 0 #6a4a1a) drop-shadow(1px 1px 0 #5a3e15) drop-shadow(1px 1px 0 #4b3311) drop-shadow(1px 1px 0 #3e2a0e) drop-shadow(7px 9px 7px rgba(40,8,0,.55))}
#mk svg{width:100%;height:100%;display:block}
</style></head><body>
<div id="p"><img id="bg" alt=""><div id="mk"><svg viewBox="0 0 32 32"><defs><linearGradient id="bz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d79a"/><stop offset=".35" stop-color="#d6ae66"/><stop offset=".7" stop-color="#b48a45"/><stop offset="1" stop-color="#8e6a31"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bz)"/><path d="M7 10 H15 A7 7 0 0 1 22 17 V25" fill="none" stroke="#5a3d14" stroke-width="4.5" stroke-linecap="round"/><path d="M7 9.3 H15 A7.6 7.6 0 0 1 22.6 17" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1" /><circle cx="22" cy="25" r="2.6" fill="#fff1d2"/></svg></div><div class="t" id="t">
<div class="lab">Happy Diwali</div>
<div class="h">Bright homes.<br><em>Brighter pipelines.</em></div>
<div class="m" id="m">Wishing you a Diwali full of light, and a year full of good conversations.</div>
</div></div>
<script>
const q=new URLSearchParams(location.search), W=+q.get('w'), H=+q.get('h'), tall=H/W>1.5;
const p=document.getElementById('p'); p.style.width=W+'px'; p.style.height=H+'px';
const bg=document.getElementById('bg'); bg.src=tall?'scene-tall.png':'scene.png';
document.getElementById('t').style.top=(tall?380:118)+'px';
if(!tall){document.getElementById('m').style.display='none';}
else{document.querySelector('.h').style.fontSize='76px';}
const mk=document.getElementById('mk'); mk.style.left='92px'; mk.style.top=(tall?1031:460)+'px';
Promise.all([document.fonts.ready,new Promise(r=>bg.complete&&bg.naturalWidth?r():bg.onload=r)]).then(()=>document.body.dataset.ready='1');
</script></body></html>
