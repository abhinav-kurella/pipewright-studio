<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipewright Diwali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Concept: the Pipewright revenue schematic, redrawn for Diwali. Every station on the pipe is a lit diya. */
:root {
  --bg: #0E1415;
  --grid: #1C2628;
  --pipe: #34423F;
  --ink: #E4EBE9;
  --muted: #95A39F;
  --brass: #D9A748;
  --brass-soft: #F2CE84;
  --line: #2A3537;
}
html, body { margin: 0; background: var(--bg); }
#poster { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 58%, #2A1D0E 0%, var(--bg) 55%); }
svg { position: absolute; inset: 0; display: block; }
.block { position: absolute; left: 72px; right: 72px; color: var(--ink); }
.eyebrow { display: flex; justify-content: space-between; font: 500 22px/1 "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 18px; border-bottom: 1px dashed var(--line); }
.eyebrow b { color: var(--brass); font-weight: 500; }
.deva { font: 400 64px/1.3 "Tiro Devanagari Hindi", serif; color: var(--brass); margin-top: 34px; }
.head { font: 700 132px/0.95 "Bricolage Grotesque", sans-serif; letter-spacing: -0.04em; margin-top: 2px; }
.head em { font-style: normal; color: var(--brass-soft); }
.sub { font: 400 34px/1.35 "IBM Plex Sans", sans-serif; color: var(--muted); margin-top: 22px; max-width: 820px; }
.sub b { color: var(--ink); font-weight: 500; }
.tb { display: grid; grid-template-columns: 1.6fr 1fr 1fr; border: 1.5px solid var(--ink); }
.tb > div { padding: 16px 18px; display: grid; gap: 8px; align-content: center; }
.tb > div + div { border-left: 1.5px solid var(--ink); }
.k { font: 500 16px/1 "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.v { font: 500 22px/1.2 "IBM Plex Mono", monospace; color: var(--ink); }
.tb > .brand { display: flex; align-items: center; gap: 14px; }
.brand-name { font: 700 30px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.02em; }
.brand-name span { font-weight: 400; color: var(--muted); }
</style>
</head>
<body>
<div id="poster">
  <svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="block" id="top">
    <div class="eyebrow"><span><b>●</b> Fig. Diwali</span><span>PW-2026</span></div>
    <div class="deva">शुभ दीपावली</div>
    <div class="head">Every connection, <em>lit.</em></div>
  </div>
  <div class="block" id="msg"><p class="sub" style="margin:0">Wishing you and the people you're connected to <b>a bright, prosperous Diwali.</b></p></div>
  <div class="block" id="foot">
    <div class="tb">
      <div class="brand"><svg width="40" height="40" viewBox="0 0 32 32" style="position:static"><rect x="1" y="1" width="30" height="30" rx="7" fill="#E4EBE9"/><path d="M7 10 H15 A7 7 0 0 1 22 17 V25" fill="none" stroke="#0E1415" stroke-width="4.5" stroke-linecap="round"/><circle cx="22" cy="25" r="2.6" fill="#D9A748"/></svg><span class="brand-name">Pipewright <span>Studio</span></span></div>
      <div><span class="k">From</span><span class="v">Abhinav Kumar</span></div>
      <div><span class="k">Occasion</span><span class="v">Deepavali</span></div>
    </div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1350;
const tall = H / W > 1.5;
document.getElementById('poster').style.cssText += `width:${W}px;height:${H}px`;
document.getElementById('top').style.top = (tall ? 150 : 70) + 'px';
document.getElementById('foot').style.bottom = (tall ? 120 : 64) + 'px';

const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
const el = (n, a, p = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const defs = el('defs', {});
const pat = el('pattern', { id: 'g', width: 36, height: 36, patternUnits: 'userSpaceOnUse' }, defs);
el('path', { d: 'M36 0H0V36', fill: 'none', stroke: '#1C2628', 'stroke-width': 1 }, pat);
const glow = el('filter', { id: 'glow', x: '-60%', y: '-60%', width: '220%', height: '220%' }, defs);
el('feGaussianBlur', { stdDeviation: 3, result: 'b' }, glow);
const mg = el('feMerge', {}, glow); el('feMergeNode', { in: 'b' }, mg); el('feMergeNode', { in: 'SourceGraphic' }, mg);
const halo = el('filter', { id: 'halo', x: '-150%', y: '-150%', width: '400%', height: '400%' }, defs);
el('feGaussianBlur', { stdDeviation: 18 }, halo);
const fl = el('linearGradient', { id: 'fl', x1: 0, y1: 1, x2: 0, y2: 0 }, defs);
[['0', '#FF7A1A'], ['.5', '#FFC24A'], ['.85', '#FFF1C4'], ['1', '#FFFFFF']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, fl));
const cl = el('linearGradient', { id: 'cl', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
[['0', '#C8653A'], ['1', '#6E2A13']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, cl));

el('rect', { width: W, height: H, fill: 'url(#g)', opacity: .9 });

// the pipe, as on the website, scaled to the canvas
const y1 = tall ? 760 : 540, gap = tall ? 250 : 188, xL = 70, xR = W - 70, r = 62;
const y2 = y1 + gap, y3 = y2 + gap;
const d = `M${xL} ${y1} H${xR - r} A${r} ${r} 0 0 1 ${xR} ${y1 + r} V${y2 - r} A${r} ${r} 0 0 1 ${xR - r} ${y2} H${xL + 60 + r} A${r} ${r} 0 0 0 ${xL + 60} ${y2 + r} V${y3 - r} A${r} ${r} 0 0 0 ${xL + 60 + r} ${y3} H${xR}`;
el('path', { d, fill: 'none', stroke: '#34423F', 'stroke-width': 22, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
el('path', { d, fill: 'none', stroke: '#0E1415', 'stroke-width': 14, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
el('path', { d, fill: 'none', stroke: '#D9A748', 'stroke-width': 2.5, 'stroke-dasharray': '2 16', 'stroke-linecap': 'round', opacity: .9, filter: 'url(#glow)' });

const diya = (x, y, s, big) => {
  el('circle', { cx: x, cy: y - 14 * s, r: 34 * s, fill: '#FFB347', opacity: big ? .55 : .38, filter: 'url(#halo)' });
  el('path', { d: `M${x - 30 * s} ${y - 6 * s} Q${x} ${y + 30 * s} ${x + 30 * s} ${y - 6 * s} Q${x} ${y} ${x - 30 * s} ${y - 6 * s}Z`, fill: 'url(#cl)' });
  el('path', { d: `M${x - 30 * s} ${y - 6 * s} Q${x} ${y} ${x + 30 * s} ${y - 6 * s}`, fill: 'none', stroke: '#D9A748', 'stroke-width': 1.6 });
  el('path', { d: `M${x} ${y - 46 * s} C${x + 11 * s} ${y - 30 * s} ${x + 9 * s} ${y - 10 * s} ${x} ${y - 6 * s} C${x - 9 * s} ${y - 10 * s} ${x - 11 * s} ${y - 30 * s} ${x} ${y - 46 * s}Z`, fill: 'url(#fl)', filter: 'url(#glow)' });
};
const label = (x, y, code, text, anchor = 'start') => {
  const t = el('text', { x, y, 'text-anchor': anchor, style: 'font:500 17px "IBM Plex Mono",monospace;letter-spacing:.12em;fill:#95A39F' }); t.textContent = code;
  const u = el('text', { x, y: y + 24, 'text-anchor': anchor, style: 'font:500 19px "IBM Plex Mono",monospace;letter-spacing:.12em;fill:#E4EBE9' }); u.textContent = text;
};
const st = [
  [xL + 120, y1, '01', 'FAMILY'], [W * 0.52, y1, '02', 'FRIENDS'],
  [W * 0.74, y2, '03', 'COLLEAGUES'], [W * 0.38, y2, '04', 'MENTORS'],
  [xL + 230, y3, '05', 'CLIENTS'],
];
st.forEach(([x, y, c, t]) => { diya(x, y + 2, 1.05); label(x - 34, y + 52, c, t); });
diya(xR - 70, y3 + 4, 1.7, true);
label(xR - 70, y3 + 70, '06', 'YOU', 'middle');

document.getElementById('msg').style.top = (y3 + (tall ? 170 : 112)) + 'px';
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
